<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131313"/>
      <stop offset="50%" stop-color="#1c1b1b"/>
      <stop offset="100%" stop-color="#0e0e0e"/>
    </linearGradient>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00a2ff"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#71ff74"/>
      <stop offset="100%" stop-color="#00e540"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with rounded gaming border -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#00a2ff" stroke-width="8" opacity="0.6"/>
  <rect x="28" y="28" width="456" height="456" rx="84" fill="none" stroke="#3f4852" stroke-width="2"/>

  <!-- Compass / Quest Symbol -->
  <circle cx="256" cy="256" r="140" fill="#201f1f" stroke="#00e540" stroke-width="6" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="110" fill="#131313" stroke="#3f4852" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- Compass Diamond Needles -->
  <path d="M256 140 L285 240 L256 256 L227 240 Z" fill="url(#neonBlue)"/>
  <path d="M256 372 L285 272 L256 256 L227 272 Z" fill="url(#neonGreen)"/>
  <path d="M140 256 L240 227 L256 256 L240 285 Z" fill="#99cbff" opacity="0.8"/>
  <path d="M372 256 L272 227 L256 256 L272 285 Z" fill="#cfe5ff" opacity="0.8"/>

  <!-- Center Core -->
  <circle cx="256" cy="256" r="22" fill="#e5e2e1" stroke="#001d34" stroke-width="5"/>
  <circle cx="256" cy="256" r="8" fill="#00a2ff"/>

  <!-- Stars -->
  <polygon points="120,130 126,144 140,144 128,154 132,168 120,158 108,168 112,154 100,144 114,144" fill="#71ff74" filter="url(#glow)"/>
  <polygon points="390,130 396,144 410,144 398,154 402,168 390,158 378,168 382,154 370,144 384,144" fill="#00a2ff" filter="url(#glow)"/>
  <polygon points="256,70 261,82 274,82 263,90 267,102 256,94 245,102 249,90 238,82 251,82" fill="#ffd700"/>

  <!-- Text / Monogram -->
  <text x="256" y="440" text-anchor="middle" fill="#99cbff" font-family="'Montserrat', sans-serif" font-weight="900" font-size="34" letter-spacing="4">DAILY QUEST</text>
</svg>
